project_id = "sevasathi"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./phase-two-demo.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.rate_limit]
sign_in_sign_ups = 10
token_refresh = 150

[auth.email]
# Enable the email provider for password sign-in. Public registration remains
# disabled by auth.enable_signup=false above; accounts use the Admin API.
enable_signup = true
enable_confirmations = true

[analytics]
enabled = false
